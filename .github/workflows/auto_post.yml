name: AI Shorts Post (Aesthetic EN)

on:
  schedule:
    # 0:00, 8:00, 13:00, 20:00 UTC
    - cron: '0 0,8,13,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-cjk

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Auto Post
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AESTHETIC_EN }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY_AESTHETIC_EN }}
        YOUTUBE_CLIENT_ID_AESTHETIC_EN: ${{ secrets.YOUTUBE_CLIENT_ID_AESTHETIC_EN }}
        YOUTUBE_CLIENT_SECRET_AESTHETIC_EN: ${{ secrets.YOUTUBE_CLIENT_SECRET_AESTHETIC_EN }}
        YOUTUBE_REFRESH_TOKEN_AESTHETIC_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_AESTHETIC_EN }}
        GITHUB_ACTIONS: "true"
        PYTHONUNBUFFERED: "1"
      run: |
        python auto_main.py

